spring:
  application:
    name: lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_db}
    username: ${DB_USERNAME:exam_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
app:
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
